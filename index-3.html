<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <form>
            <h1>Sign Up</h1>
            <lable for="sname">Enter Your Name:</lable>
            <input type="text" id="sname" placeholder="Eg:don" name="sname" /><br /><br />
            <label for="gmail">Enter Your Email:</label>
            <input type="email" id="gmail" placeholder="Eg:don@gmail.com" name="gmail" /><br /><br />
            <lable for="pswr">Enter Your Password:</lable>
            <input type="pswr" id="pswrd" placeholder="Enter Your Password" pattern="{0,9}{2,8}" /><br /><br />
            <lable for="pswr">Confirm Password:</lable>
            <input type="pswr" id="pswrd" placeholder="Confirm Password" pattern="{0,9}{2,8}" /><br /><br />
            <lable for="num">Enter Phone Number:</lable>
            <input type="tel" id="num" placeholder="Eg:9899453216" name="num" /><br /><br />
            <label for="DOB">Enter Your DOB:</label>
            <input type="date" id="dob" /><br /><br />
            <label for="file">Upload Photo:</label>
            <input type="file" id="file" /><br /><br />
            <label>Gender:</label>
            <input type="radio" id="male" name=gender value="male" />
            <label for="male">Male</label>
            <input type="radio" id="female" name="female" value="gender" />
            <label for="female">Female</label><br /><br />
            <input style="background-color: cornflowerblue;" type="submit" value="Create Account" />
            
        </form><br />
        <form action="./index.html">
            <input style="background-color: cornflowerblue;" type="submit" value="Go Back To Home Page" formaction="./index.html"/>
        </form>
        
    </center>
    
</body>
</html>
